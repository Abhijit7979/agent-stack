# Local stand-in for the VPS. From stack/deploy/:
#   docker compose up -d --build
#   docker compose exec hermes bash /stack/deploy/install.sh
services:
  hermes:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: agent-stack
    command: gateway run
    env_file: .env            # GH_TOKEN=... (gitignored, never committed)
    volumes:
      - hermes-data:/opt/data # named volume: WAL-safe on macOS (bind mounts are not)
    restart: unless-stopped

volumes:
  hermes-data:
