# Local stand-in for the VPS. From stack/deploy/:
#   docker compose up -d --build      (start.sh runs install.sh on every boot)
services:
  hermes:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: agent-stack
    command: bash /stack/deploy/start.sh
    env_file: .env            # GH_TOKEN=... (gitignored, never committed)
    volumes:
      - hermes-data:/opt/data # named volume: WAL-safe on macOS (bind mounts are not)
    restart: unless-stopped

volumes:
  hermes-data:
